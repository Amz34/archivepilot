[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archivepilot"
version = "0.1.0"
description = "Your data, one private AI archive. Local-first, zero-dependency, EN + AR full-text search + AI answers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["archive", "privacy", "search", "arabic", "ai", "local-first", "sqlite", "fts5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
    "Topic :: Database :: Front-Ends",
]
dependencies = []

[project.scripts]
archivepilot = "archivepilot.cli:main"

[tool.setuptools]
packages = ["archivepilot"]
